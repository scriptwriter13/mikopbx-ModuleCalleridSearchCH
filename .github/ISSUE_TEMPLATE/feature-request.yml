name: ✨ Feature Request
description: Suggest an idea or new feature for the module
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your suggestion! Please share your idea for improving the module.
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What would you like to see added or changed?
      placeholder: Describe the feature or improvement...
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case / Context
      description: Why would this feature be useful? What problem does it solve?
      placeholder: Explain why this is needed...
    validations:
      required: false
